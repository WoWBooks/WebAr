<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>De onzichtbare ketting — AR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; font-family: 'Georgia', serif; }
    #laadscherm {
      position: fixed; inset: 0; background: #0a0805;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 9999; text-align: center;
      padding: 2rem; transition: opacity 1s ease;
    }
    #laadscherm .titel { font-size: 10px; letter-spacing: 0.25em; color: rgba(200,168,74,0.5); text-transform: uppercase; margin-bottom: 1.5rem; }
    #laadscherm p { font-size: 14px; color: #c8b890; font-style: italic; line-height: 1.8; margin-bottom: 2rem; }
    #laadscherm .instructie { font-size: 11px; color: rgba(200,168,74,0.4); letter-spacing: 0.1em; line-height: 1.9; margin-bottom: 2.5rem; }
    #laadscherm button { background: transparent; border: 0.5px solid rgba(200,168,74,0.5); color: rgba(200,168,74,0.9); font-family: 'Georgia', serif; font-size: 11px; letter-spacing: 0.2em; padding: 14px 32px; cursor: pointer; text-transform: uppercase; }
    #herhaal { position: fixed; bottom: 2rem; right: 1.5rem; background: rgba(0,0,0,0.6); border: 0.5px solid rgba(200,168,74,0.3); color: rgba(200,168,74,0.6); font-family: 'Georgia', serif; font-size: 10px; letter-spacing: 0.15em; padding: 8px 16px; cursor: pointer; text-transform: uppercase; z-index: 999; display: none; }
  </style>
</head>
<body>

<div id="laadscherm">
  <p class="titel">Wat je schaduw je wil vertellen</p>
  <p>Hoofdstuk 1<br>De onzichtbare ketting</p>
  <p class="instructie">
    Stap 1 — Richt camera op Hiro marker<br>
    Stap 2 — Houd stil op 30cm afstand<br>
    Stap 3 — De woorden verschijnen
  </p>
  <button onclick="startAR()">✦ &nbsp; Start AR</button>
</div>

<button id="herhaal" onclick="location.reload()">↺ Opnieuw</button>

<a-scene id="arscene" embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  style="display:none">

  <a-marker preset="hiro">

    <!-- Regel 1: hoog boven marker, klein -->
    <a-text value="Ze keek in de spiegel,"
      align="center" color="#e8d8b0" opacity="0"
      width="2" position="0 0 -0.8" rotation="0 0 0"
      animation__verschijn="property: opacity; from: 0; to: 0.9; dur: 2000; delay: 500"
      animation__zweef="property: position; from: 0 0 -0.8; to: 0 0.05 -0.8; dur: 3000; delay: 500; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-text>

    <a-text value="maar zag niet alleen zichzelf."
      align="center" color="#c8b890" opacity="0"
      width="2" position="0 0 -0.5" rotation="0 0 0"
      animation__verschijn="property: opacity; from: 0; to: 0.8; dur: 2000; delay: 1500"
      animation__zweef="property: position; from: 0 0 -0.5; to: 0 0.05 -0.5; dur: 3200; delay: 1500; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-text>

    <!-- Climax: groter, helderder -->
    <a-text value="Daarna moest"
      align="center" color="#f0e4c4" opacity="0"
      width="2.5" position="0 0 0" rotation="0 0 0"
      animation__verschijn="property: opacity; from: 0; to: 1; dur: 2500; delay: 4000"
      animation__zweef="property: position; from: 0 0 0; to: 0 0.08 0; dur: 2800; delay: 4000; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-text>

    <a-text value="de waarheid op tafel komen."
      align="center" color="#f0e4c4" opacity="0"
      width="2.5" position="0 0 0.35" rotation="0 0 0"
      animation__verschijn="property: opacity; from: 0; to: 1; dur: 2500; delay: 5000"
      animation__zweef="property: position; from: 0 0 0.35; to: 0 0.08 0.35; dur: 2800; delay: 5000; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-text>

    <!-- Subtitel -->
    <a-text value="Wat lang verzwegen bleef..."
      align="center" color="#8a7850" opacity="0"
      width="1.8" position="0 0 0.7" rotation="0 0 0"
      animation__verschijn="property: opacity; from: 0; to: 0.6; dur: 2000; delay: 7000"
    ></a-text>

    <!-- Gouden deeltjes -->
    <a-sphere color="#c8a84a" opacity="0.7" radius="0.02" position="-0.4 0.1 0"
      animation="property: position; from: -0.4 0.1 0; to: -0.5 0.5 0; dur: 3000; loop: true; easing: easeInSine"
    ></a-sphere>
    <a-sphere color="#c8a84a" opacity="0.5" radius="0.015" position="0.4 0.1 0.2"
      animation="property: position; from: 0.4 0.1 0.2; to: 0.5 0.6 0.2; dur: 4000; loop: true; easing: easeInSine"
    ></a-sphere>
    <a-sphere color="#e8d070" opacity="0.6" radius="0.01" position="0 0.1 -0.3"
      animation="property: position; from: 0 0.1 -0.3; to: 0.1 0.7 -0.3; dur: 3500; loop: true; easing: easeInSine"
    ></a-sphere>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  function startAR() {
    document.getElementById('laadscherm').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('laadscherm').style.display = 'none';
      document.getElementById('arscene').style.display = 'block';
      document.getElementById('herhaal').style.display = 'block';
    }, 1000);
  }
</script>
</body>
</html>
