<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>De onzichtbare ketting — AR</title>

  <!-- A-Frame -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <!-- AR.js voor A-Frame (markerless / location based uitgeschakeld, we gebruiken marker) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; font-family: 'Georgia', serif; }

    /* Laadscherm */
    #laadscherm {
      position: fixed;
      inset: 0;
      background: #0a0805;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      text-align: center;
      padding: 2rem;
      transition: opacity 1s ease;
    }

    #laadscherm .titel {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: rgba(200,168,74,0.5);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    #laadscherm p {
      font-size: 14px;
      color: #c8b890;
      font-style: italic;
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    #laadscherm .instructie {
      font-size: 11px;
      color: rgba(200,168,74,0.4);
      letter-spacing: 0.1em;
      line-height: 1.9;
      margin-bottom: 2.5rem;
    }

    #laadscherm button {
      background: transparent;
      border: 0.5px solid rgba(200,168,74,0.5);
      color: rgba(200,168,74,0.9);
      font-family: 'Georgia', serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      padding: 14px 32px;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* Hiro marker uitleg */
    #marker-uitleg {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(200,168,74,0.4);
      letter-spacing: 0.12em;
      text-align: center;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
      display: none;
    }

    /* Herhaal knop */
    #herhaal {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      background: rgba(0,0,0,0.6);
      border: 0.5px solid rgba(200,168,74,0.3);
      color: rgba(200,168,74,0.6);
      font-family: 'Georgia', serif;
      font-size: 10px;
      letter-spacing: 0.15em;
      padding: 8px 16px;
      cursor: pointer;
      text-transform: uppercase;
      z-index: 999;
      display: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

<!-- Laadscherm -->
<div id="laadscherm">
  <p class="titel">Wat je schaduw je wil vertellen</p>
  <p>Hoofdstuk 1<br>De onzichtbare ketting</p>
  <p class="instructie">
    Stap 1 — Print de Hiro marker<br>
    Stap 2 — Leg hem naast de pagina<br>
    Stap 3 — Richt je camera erop<br>
    Stap 4 — De woorden verschijnen
  </p>
  <button onclick="startAR()">✦ &nbsp; Start AR</button>
</div>

<p id="marker-uitleg">Richt camera op de Hiro marker ↓</p>
<button id="herhaal" onclick="location.reload()">↺ Opnieuw</button>

<!-- A-Frame AR scene -->
<a-scene
  id="arscene"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; antialias: true;"
  style="display:none"
>

  <!-- Hiro marker als anker -->
  <a-marker preset="hiro" id="marker">

    <!-- Regel 1 — zweeft laag, warm goud -->
    <a-text
      value="Ze keek in de spiegel,"
      align="center"
      color="#e8d8b0"
      opacity="0"
      width="3.5"
      position="0 0.8 0"
      rotation="-90 0 0"
      animation__verschijn="property: opacity; from: 0; to: 0.9; dur: 2000; delay: 500; easing: easeInOutSine"
      animation__zweef="property: position; from: 0 0.8 0; to: 0 1.0 0; dur: 3000; delay: 500; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-text>

    <a-text
      value="maar zag niet alleen zichzelf."
      align="center"
      color="#c8b890"
      opacity="0"
      width="3.5"
      position="0 0.55 0"
      rotation="-90 0 0"
      animation__verschijn="property: opacity; from: 0; to: 0.8; dur: 2000; delay: 1200; easing: easeInOutSine"
      animation__zweef="property: position; from: 0 0.55 0; to: 0 0.75 0; dur: 3200; delay: 1200; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-text>

    <!-- Scheidingslijn -->
    <a-plane
      color="#c8a84a"
      opacity="0"
      width="1.2"
      height="0.005"
      position="0 0.2 0"
      rotation="-90 0 0"
      animation__verschijn="property: opacity; from: 0; to: 0.4; dur: 1500; delay: 3000; easing: easeInOutSine"
    ></a-plane>

    <!-- Regel 2 — de climax, groter en helderder -->
    <a-text
      value="Daarna moest de waarheid"
      align="center"
      color="#f0e4c4"
      opacity="0"
      width="4"
      position="0 -0.1 0"
      rotation="-90 0 0"
      animation__verschijn="property: opacity; from: 0; to: 1; dur: 2500; delay: 4000; easing: easeInOutSine"
      animation__zweef="property: position; from: 0 -0.1 0; to: 0 0.1 0; dur: 2800; delay: 4000; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-text>

    <a-text
      value="op tafel komen."
      align="center"
      color="#f0e4c4"
      opacity="0"
      width="4"
      position="0 -0.4 0"
      rotation="-90 0 0"
      animation__verschijn="property: opacity; from: 0; to: 1; dur: 2500; delay: 5000; easing: easeInOutSine"
      animation__zweef="property: position; from: 0 -0.4 0; to: 0 -0.2 0; dur: 2800; delay: 5000; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-text>

    <!-- Subtitel -->
    <a-text
      value="Wat lang verzwegen bleef..."
      align="center"
      color="#8a7850"
      opacity="0"
      width="2.8"
      position="0 -0.75 0"
      rotation="-90 0 0"
      animation__verschijn="property: opacity; from: 0; to: 0.7; dur: 2000; delay: 7000; easing: easeInOutSine"
    ></a-text>

    <!-- Gouden deeltjes — kleine bolletjes die opstijgen -->
    <a-sphere color="#c8a84a" opacity="0" radius="0.015" position="-0.5 0.3 0"
      animation__verschijn="property: opacity; from: 0; to: 0.8; dur: 1000; delay: 2000"
      animation__zweef="property: position; from: -0.5 0.3 0; to: -0.6 1.2 0; dur: 4000; delay: 2000; loop: true; easing: easeInSine"
    ></a-sphere>

    <a-sphere color="#c8a84a" opacity="0" radius="0.01" position="0.3 0.1 0"
      animation__verschijn="property: opacity; from: 0; to: 0.6; dur: 1000; delay: 3500"
      animation__zweef="property: position; from: 0.3 0.1 0; to: 0.5 1.0 0; dur: 5000; delay: 3500; loop: true; easing: easeInSine"
    ></a-sphere>

    <a-sphere color="#e8d070" opacity="0" radius="0.008" position="0 0.5 0"
      animation__verschijn="property: opacity; from: 0; to: 0.5; dur: 1000; delay: 5500"
      animation__zweef="property: position; from: 0 0.5 0; to: 0.2 1.4 0; dur: 3500; delay: 5500; loop: true; easing: easeInSine"
    ></a-sphere>

    <a-sphere color="#c8a84a" opacity="0" radius="0.012" position="-0.2 -0.3 0"
      animation__verschijn="property: opacity; from: 0; to: 0.7; dur: 1000; delay: 6000"
      animation__zweef="property: position; from: -0.2 -0.3 0; to: -0.4 0.8 0; dur: 4500; delay: 6000; loop: true; easing: easeInSine"
    ></a-sphere>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  function startAR() {
    document.getElementById('laadscherm').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('laadscherm').style.display = 'none';
      document.getElementById('arscene').style.display = 'block';
      document.getElementById('marker-uitleg').style.display = 'block';
      document.getElementById('herhaal').style.display = 'block';
    }, 1000);
  }

  // Verberg uitleg zodra marker gevonden is
  document.addEventListener('DOMContentLoaded', () => {
    const marker = document.getElementById('marker');
    if (marker) {
      marker.addEventListener('markerFound', () => {
        document.getElementById('marker-uitleg').style.display = 'none';
      });
      marker.addEventListener('markerLost', () => {
        document.getElementById('marker-uitleg').style.display = 'block';
      });
    }
  });
</script>

</body>
</html>
